<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ydke → ydk 整理工具</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: #f8fafc; margin: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 960px; width: 100%; background: white;
            border-radius: 28px; box-shadow: 0 20px 35px -8px rgba(0,0,0,0.15), 0 4px 8px -2px rgba(0,0,0,0.05);
            padding: 2rem 2rem 1.8rem; border: 1px solid #e9eef3;
        }
        h1 {
            font-size: 1.9rem; font-weight: 600; letter-spacing: -0.01em;
            margin: 0 0 0.2rem 0; display: flex; align-items: center; gap: 8px; color: #0b1a2b;
        }
        h1 small {
            font-size: 0.9rem; font-weight: 400; color: #5b6d82;
            background: #eef2f6; padding: 2px 10px; border-radius: 100px; margin-left: 8px;
        }
        .subhead {
            color: #4a5e74; margin-bottom: 2rem; font-size: 0.95rem;
            border-left: 3px solid #3b82f6; padding-left: 1rem;
            background: #f2f7ff; border-radius: 0 12px 12px 0;
            padding: 0.8rem 1rem; line-height: 1.5;
        }
        .subhead code {
            background: #d9e6ff; padding: 0.2rem 0.4rem; border-radius: 8px; font-size: 0.9em;
        }
        .panel {
            background: #ffffff; border-radius: 20px; border: 1px solid #e2e9f1;
            padding: 1.2rem 1.2rem 1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: border-color 0.15s; margin-bottom: 1.2rem;
        }
        .panel:hover { border-color: #cbd9e9; }
        .panel h2 {
            font-size: 1.1rem; font-weight: 600; margin: 0 0 1rem 0;
            color: #1e2e45; display: flex; align-items: center; gap: 6px;
        }
        .panel h2 span {
            font-size: 0.75rem; font-weight: 400; background: #dbeafe;
            color: #1e4b8f; padding: 2px 8px; border-radius: 20px;
        }
        label {
            display: block; font-size: 0.8rem; font-weight: 500; color: #3a4d64;
            margin-bottom: 0.25rem; letter-spacing: 0.3px; text-transform: uppercase;
        }
        input, textarea {
            width: 100%; padding: 0.65rem 0.9rem; border-radius: 14px;
            border: 1px solid #d4dfeb; font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9rem; background: #fbfdff; transition: all 0.15s;
            outline: none; resize: vertical;
        }
        input:focus, textarea:focus {
            border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); background: #ffffff;
        }
        textarea { min-height: 70px; line-height: 1.5; }
        .field-group { margin-bottom: 0.9rem; }
        .field-group:last-child { margin-bottom: 0; }
        .inline-buttons { display: flex; gap: 10px; margin-top: 0.5rem; flex-wrap: wrap; }
        button {
            background: white; border: 1px solid #cbdae9; border-radius: 40px;
            padding: 0.55rem 1.2rem; font-weight: 500; font-size: 0.9rem;
            color: #1e3a5f; cursor: pointer; display: inline-flex;
            align-items: center; justify-content: center; gap: 6px;
            transition: all 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.02); flex: 0 0 auto;
        }
        button:hover {
            background: #f1f7ff; border-color: #90b4e0;
            box-shadow: 0 4px 8px -4px rgba(0,0,0,0.1);
        }
        button:active { background: #e4efff; transform: scale(0.98); }
        button.primary {
            background: #1e4b8f; border-color: #1e4b8f; color: white;
        }
        button.primary:hover { background: #103c73; border-color: #103c73; }
        button.primary:active { background: #0b2b52; }
        button.outline { background: transparent; border: 1px solid #cdddeb; }
        button.small { padding: 0.3rem 0.9rem; font-size: 0.8rem; border-radius: 30px; }
        button.download {
            background: #0f6b4b; border-color: #0f6b4b; color: white;
        }
        button.download:hover { background: #0a5138; border-color: #0a5138; }
        button.download:active { background: #07412d; }
        .result-area {
            background: #f5f9ff; border-radius: 16px; border: 1px dashed #b8d0ea;
            padding: 1rem 1.2rem; margin-top: 1rem; font-family: 'SF Mono', monospace;
            font-size: 0.9rem; word-break: break-all; color: #0b2b52;
            transition: background 0.1s; min-height: 3.2rem;
        }
        .result-area.error {
            background: #fff2f0; border-color: #f5b5ab; color: #b3402c;
        }
        .passcode-list {
            font-family: 'SF Mono', monospace; background: #ffffffc0;
            padding: 0.4rem 0.8rem; border-radius: 10px; margin: 0.2rem 0;
            display: inline-block; word-break: break-word;
            border: 1px solid #e4edf8; line-height: 1.6;
        }
        .u32-preview {
            font-size: 0.75rem; color: #3d5d84; background: #eaf2fd;
            padding: 0.15rem 0.5rem; border-radius: 30px;
        }
        .ydk-output {
            background: #f9fcff; border: 1px solid #d7e3f0; border-radius: 14px;
            padding: 1rem 1.2rem; font-family: 'SF Mono', monospace;
            font-size: 0.85rem; white-space: pre-wrap; max-height: 400px;
            overflow-y: auto; line-height: 1.6; color: #1a304a;
            margin-top: 0.8rem; word-break: break-all;
        }
        .footnote {
            margin-top: 1.8rem; font-size: 0.75rem; color: #7b8da0;
            text-align: center; border-top: 1px solid #e2eaf3; padding-top: 1rem;
            display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;
        }
        .flex-between {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            flex-wrap: wrap;
        }
        .creator-row {
            display: flex; align-items: center; gap: 10px; margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .creator-row label {
            margin-bottom: 0; text-transform: none; font-size: 0.85rem; flex: 0 0 auto;
        }
        .creator-row .creator-value {
            font-family: 'SF Mono', monospace; font-size: 0.85rem;
            color: #0b2b52; background: #f0f5fe; padding: 0.4rem 1rem;
            border-radius: 30px; border: 1px solid #d7e3f0;
            flex: 1 0 180px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            ydke → ydk 整理工具
            <small>一键转换</small>
        </h1>
        <div class="subhead">
            解析 <code>ydke://</code> 链接 → 自动整理成 <code>.ydk</code> 文本格式（#main / #extra / !side）
        </div>

        <!-- 解析 ydke 输入 -->
        <div class="panel">
            <h2>解析 ydke:// 链接 <span>parseURL → ydk</span></h2>
            <div class="field-group">
                <label for="ydkeInput">粘贴 ydke:// 链接</label>
                <textarea id="ydkeInput" rows="3" placeholder="ydke://..."></textarea>
            </div>
            <div class="inline-buttons">
                <button id="parseBtn" class="primary">解析并整理成 ydk</button>
                <button id="clearBtn" class="outline small">清空</button>
            </div>

            <!-- 解析结果 (三个列表) -->
            <div id="parseResult" class="result-area" style="margin-top: 1rem;">
                <span style="color:#607b99;">解析结果将显示在这里</span>
            </div>
        </div>

        <!-- ydk 整理输出 -->
        <div class="panel" id="ydkPanel" style="display: none;">
            <h2>整理后的 YDK 文本 <span>可直接保存为 .ydk</span></h2>

            <div class="creator-row">
                <label>#created by</label>
                <span class="creator-value">花花的黑眼圈加重了吗</span>
            </div>

            <div class="flex-between">
                <span style="font-size:0.8rem; color:#4a5e74;">每行一个密码 · 可下载为 .ydk 文件</span>
                <button id="downloadYdkBtn" class="download">下载 .ydk 文件</button>
            </div>

            <div id="ydkOutput" class="ydk-output">
                <span style="color:#607b99;">ydk 文本将显示在这里</span>
            </div>
        </div>

        <!-- 脚注 -->
        <div class="footnote">
        </div>
    </div>

    <script>
        (function(){
            // ---------- 固定的 created by 内容 ----------
            const CREATOR = '花花的黑眼圈加重了吗';

            // ---------- 核心转换 (与原 ydke.js 一致) ----------
            function base64ToPasscodes(base64) {
                const binaryString = atob(base64);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return new Uint32Array(bytes.buffer);
            }

            function parseURL(ydke) {
                if (!ydke.startsWith('ydke://')) {
                    throw new Error('Unrecognized URL protocol');
                }
                const components = ydke.slice('ydke://'.length).split('!');
                if (components.length < 3) {
                    throw new Error('Missing ydke URL component');
                }
                return {
                    main: base64ToPasscodes(components[0]),
                    extra: base64ToPasscodes(components[1]),
                    side: base64ToPasscodes(components[2])
                };
            }

            // ---------- 将卡组对象整理成 YDK 文本 ----------
            function generateYdkText(deck) {
                const lines = [];
                lines.push(`#created by ${CREATOR}`);
                lines.push('#main');
                deck.main.forEach(p => lines.push(p.toString()));
                lines.push('#extra');
                deck.extra.forEach(p => lines.push(p.toString()));
                lines.push('!side');
                deck.side.forEach(p => lines.push(p.toString()));
                return lines.join('\n');
            }

            // ---------- 辅助 ----------
            function formatPasscodeArray(u32arr) {
                if (!u32arr || u32arr.length === 0) return '[] (空)';
                return '[' + Array.from(u32arr).join(', ') + ']';
            }

            // ---------- 全局状态 ----------
            let currentDeck = null;

            // ---------- DOM ----------
            const ydkeInput = document.getElementById('ydkeInput');
            const parseBtn = document.getElementById('parseBtn');
            const clearBtn = document.getElementById('clearBtn');
            const parseResult = document.getElementById('parseResult');
            const ydkPanel = document.getElementById('ydkPanel');
            const ydkOutput = document.getElementById('ydkOutput');
            const downloadYdkBtn = document.getElementById('downloadYdkBtn');

            // ---------- 渲染 ydk 文本 ----------
            function renderYdk() {
                if (!currentDeck) {
                    ydkOutput.innerHTML = '<span style="color:#607b99;">ydk 文本将显示在这里</span>';
                    return;
                }
                const ydkText = generateYdkText(currentDeck);
                const escaped = ydkText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                ydkOutput.innerHTML = escaped;
            }

            // ---------- 解析 + 自动整理 ----------
            function performParse() {
                const raw = ydkeInput.value.trim();
                if (!raw) {
                    parseResult.innerHTML = '请输入 ydke:// 链接';
                    parseResult.classList.add('error');
                    ydkPanel.style.display = 'none';
                    return;
                }
                try {
                    const deck = parseURL(raw);
                    currentDeck = deck;

                    parseResult.classList.remove('error');
                    parseResult.innerHTML = `
                        <div style="font-weight:600; margin-bottom:6px;">解析成功</div>
                        <div><span class="u32-preview">主卡组 (${deck.main.length} 张)</span> <span class="passcode-list">${formatPasscodeArray(deck.main)}</span></div>
                        <div><span class="u32-preview">额外卡组 (${deck.extra.length} 张)</span> <span class="passcode-list">${formatPasscodeArray(deck.extra)}</span></div>
                        <div><span class="u32-preview">副卡组 (${deck.side.length} 张)</span> <span class="passcode-list">${formatPasscodeArray(deck.side)}</span></div>
                    `;

                    ydkPanel.style.display = 'block';
                    renderYdk();
                } catch (e) {
                    parseResult.classList.add('error');
                    parseResult.innerHTML = `错误: ${e.message}`;
                    ydkPanel.style.display = 'none';
                    currentDeck = null;
                }
            }

            // ---------- 下载 .ydk 文件 ----------
            function downloadYdk() {
                if (!currentDeck) {
                    alert('暂无卡组数据，请先解析 ydke 链接');
                    return;
                }
                const ydkText = generateYdkText(currentDeck);
                const now = new Date();
                const pad = (n) => n.toString().padStart(2, '0');
                const filename = `ydk_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.ydk`;

                const blob = new Blob([ydkText], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                const originalText = downloadYdkBtn.textContent;
                downloadYdkBtn.textContent = '已开始下载';
                setTimeout(() => { downloadYdkBtn.textContent = originalText; }, 1500);
            }

            // ---------- 事件绑定 ----------
            parseBtn.addEventListener('click', performParse);
            clearBtn.addEventListener('click', () => {
                ydkeInput.value = '';
                parseResult.innerHTML = '<span style="color:#607b99;">解析结果将显示在这里</span>';
                parseResult.classList.remove('error');
                ydkPanel.style.display = 'none';
                currentDeck = null;
            });

            downloadYdkBtn.addEventListener('click', downloadYdk);

            ydkeInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    performParse();
                }
            });
        })();
    </script>
</body>
</html>
